# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Read the Docs no longer accepts python.version: the build image and the Python version go here
build:
   os: ubuntu-22.04
   tools:
      python: "3.8"

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# Install the package with the requirements of the documentation
python:
   install:
      - method: pip
        path: .
        extra_requirements:
           - docs
